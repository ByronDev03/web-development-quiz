<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Interactive Web Development Quiz">
    <title>Web Development Quiz</title>

    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="quiz-app">
        <header class="quiz-header">
            <h1>WEB DEVELOPMENT QUIZ</h1>
            <p>Test your web development knowledge.</p>
        </header>

        <section class="quiz-card" aria-labelledby="question-title">
            <div class="quiz-top">
                <span id="question-counter">Question 1 of 31</span>
                <span id="score">Score: 0</span>
            </div>

            <div class="progress-bar" aria-hidden="true">
                <div id="progress" class="progress"></div>
            </div>

            <div class="question-section">
                <h2 id="question-title"></h2>
                <div id="answers" class="answers" role="radiogroup" aria-label="Answer options"></div>
            </div>

            <div id="feedback" class="feedback" aria-live="polite" hidden></div>

            <div class="quiz-actions">
                <button id="check-btn" class="btn btn-primary" type="button">
                    Check Answer
                </button>

                <button id="next-btn" class="btn btn-primary" type="button" hidden>
                    Next Question
                </button>
            </div>
        </section>

        <section id="results" class="results-card" aria-live="polite" hidden>
            <span class="results-label">QUIZ COMPLETED</span>
            <div id="final-score" class="final-score">0 / 31</div>
            <div id="final-percentage" class="final-percentage">0%</div>

            <div class="result-details">
                <div>
                    <strong id="correct-count">0</strong>
                    <span>Correct</span>
                </div>
                <div>
                    <strong id="incorrect-count">0</strong>
                    <span>Incorrect</span>
                </div>
            </div>

            <button id="restart-btn" class="btn btn-primary" type="button">
                Try Again
            </button>
        </section>
    </main>

    <script src="main.js"></script>
</body>
</html>
